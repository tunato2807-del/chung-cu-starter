name: chung-cu-thesis-mysql
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-chung_cu_do_an}
      MYSQL_USER: ${DB_USER:-chung_cu}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run npm run init:local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate local root password}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - thesis_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
volumes:
  thesis_mysql_data:
