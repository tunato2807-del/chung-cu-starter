name: chung-cu-postgresql
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-chung_cu}
      POSTGRES_USER: ${DB_USER:-chung_cu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run npm run init:local or configure PostgreSQL first}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 40
volumes:
  postgres_data:
