services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chung_cu
      MYSQL_USER: chung_cu
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run npm run init:local first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run init:local first}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
volumes:
  mysql_data:
